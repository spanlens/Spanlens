name: E2E (Playwright smoke)

# Runs on pull requests that touch the paths this suite actually exercises
# (auth, proxy, ingest, billing, the request log, the web middleware and
# the dashboard routes the spec visits), and on demand from the Actions UI.
#
# It used to be manual-only, and that hid a deterministic failure: the
# smoke spec never marked onboarding complete and the web process had no
# service-role key, so the login always landed on /onboarding and the URL
# wait timed out. Nobody ran it, so nobody saw. The path filter keeps
# unrelated PRs (docs, marketing pages, SDK) from paying for the
# several-minute Supabase stack bring-up.
on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/server/src/proxy/**'
      - 'apps/server/src/middleware/**'
      - 'apps/server/src/api/ingest.ts'
      - 'apps/server/src/api/otlp.ts'
      - 'apps/server/src/api/billing.ts'
      - 'apps/server/src/api/paddleWebhook.ts'
      - 'apps/server/src/api/requests.ts'
      - 'apps/server/src/api/feedback.ts'
      - 'apps/server/src/lib/logger.ts'
      - 'apps/server/src/lib/crypto.ts'
      - 'apps/server/src/lib/postgres.ts'
      - 'apps/server/src/lib/requests-query.ts'
      - 'apps/server/src/lib/quota.ts'
      - 'apps/server/src/app.ts'
      - 'apps/server/scripts/mock-openai-server.ts'
      - 'apps/web/middleware.ts'
      - 'apps/web/lib/supabase/**'
      - 'apps/web/app/login/**'
      - 'apps/web/app/auth/**'
      - 'apps/web/app/(dashboard)/layout.tsx'
      - 'apps/web/app/(dashboard)/requests/**'
      - 'apps/web/__e2e__/**'
      - 'apps/web/playwright.config.ts'
      - 'supabase/superseded-migrations.txt'
      - 'scripts/superseded-migrations.mjs'
      - '.github/workflows/e2e.yml'
  workflow_dispatch:

# A new push to the same PR makes the previous run's result moot.
concurrency:
  group: e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# R-3 / R-23: smoke.spec.ts signs a pre-seeded user in through the login
# form, sends a proxy call, and checks the row shows up on /requests.
# feedback.spec.ts exercises the feedback API. Both live in apps/web/__e2e__/.
#
# Stack we bring up in CI (mirrors `docker compose -f docker-compose.dev.yml`):
#
#   supabase  via `supabase start` CLI (gotrue + kong + db, official wiring)
#   server      pnpm --filter server dev (background)
#   web         pnpm --filter web dev (background)
#   mock-openai pnpm --filter server exec tsx scripts/mock-openai-server.ts (background)
#
# We do NOT use `docker compose up server` in CI because the dev container
# rebuilds on every push and that wastes 60-90s. Running the dev servers
# directly with `pnpm dev` is faster and gives Playwright a tighter signal.
#
# Artifacts: test-results/ (traces, screenshots, videos) + playwright-report/
# uploaded on failure for triage.

jobs:
  e2e:
    name: Playwright smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # apps/web/lib/api-client.ts imports a runtime value
      # (isApiErrorEnvelope) from @spanlens/api-types, whose exports point at
      # dist/. `pnpm install` does not build it, so without this step every
      # dashboard page fails to compile under `next dev`. ci.yml has had the
      # same step since #277; this workflow never got it.
      - name: Build @spanlens/api-types
        run: pnpm --filter @spanlens/api-types build

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          # Same pin as ci.yml. `latest` resolves through the GitHub release
          # API, which intermittently 504s and would now fail PRs rather
          # than the occasional manual run. Bump both files together.
          version: 2.106.0
        env:
          # Without GITHUB_TOKEN setup-cli goes anonymous and shares the
          # runner IP's 60/h rate limit (PR #269 CI #9 died on exactly that).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # supabase start brings up the full Postgres + GoTrue + Kong + Studio
      # stack on a set of well-known ports. The status output is JSON so we
      # can read service_role_key + api_url without parsing log lines.
      - name: Start Supabase stack
        run: |
          # Skip superseded migrations (fake-applied in production, broken on
          # a fresh database). The list lives in supabase/superseded-migrations.txt
          # and is shared with ci.yml and the init.sql generator; add entries
          # there, never here.
          node scripts/superseded-migrations.mjs remove
          supabase start
          # `supabase start` brings up the stack with a baseline schema, but
          # does NOT always replay every file under supabase/migrations/
          # against the local DB — a row from a newer migration can be
          # missing from PostgREST's schema cache (PR #269 CI #4 hit exactly
          # this: provider_keys.project_id added in 20260505040000_unified_keys.sql
          # was absent). `db reset --no-seed` re-applies all migrations in
          # order. `--no-seed` skips supabase/seed.sql so dev fixtures don't
          # pollute the E2E run.
          supabase db reset --no-seed
          # Diagnostic: confirm the column actually landed in the DB. If
          # this prints `project_id` then the migration ran and the issue
          # is PostgREST schema cache (next step handles it). If absent,
          # the migration itself didn't apply and the next step's bounce
          # won't help.
          PGPASSWORD=postgres psql -h localhost -p 54322 -U postgres -d postgres \
            -c "SELECT column_name FROM information_schema.columns WHERE table_name='provider_keys' ORDER BY ordinal_position;"
          # NOTIFY-based reload (CI #6) did not flip the cache — supabase
          # CLI's bundled PostgREST either ignores the notification or
          # caches the schema in a way the LISTEN handler doesn't rebuild.
          # Bounce the whole supabase stack instead. Adds ~60-90s to the
          # workflow but guarantees PostgREST rebuilds the schema cache
          # from the current DB state. The earlier `db reset` is still
          # needed because `supabase start` after `supabase stop` doesn't
          # re-apply migrations a second time.
          supabase stop --no-backup
          supabase start
          # Mirror the hosted platform's table grants for service_role. The
          # spec seeds its tenant through PostgREST as service_role, and some
          # CLI images create migration tables without those grants (see
          # scripts/local-db-setup.mjs). Tables and sequences only, so no
          # migration's function REVOKE is undone. A no-op where they exist.
          PGPASSWORD=postgres psql -h localhost -p 54322 -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c "GRANT ALL ON ALL TABLES IN SCHEMA public TO service_role; GRANT ALL ON ALL SEQUENCES IN SCHEMA public TO service_role;"
          # Re-read keys after the bounce: the new instance may have rotated
          # them (in practice supabase keeps deterministic local-dev keys but
          # we don't want to rely on that). Persist them so later steps read
          # them from $GITHUB_ENV.
          status_json=$(supabase status -o json)
          {
            echo "E2E_SUPABASE_URL=$(echo "$status_json" | jq -r .API_URL)"
            echo "E2E_SUPABASE_SERVICE_KEY=$(echo "$status_json" | jq -r .SERVICE_ROLE_KEY)"
            echo "E2E_SUPABASE_ANON_KEY=$(echo "$status_json" | jq -r .ANON_KEY)"
          } >> "$GITHUB_ENV"

      - name: Install Playwright browsers
        run: pnpm --filter web exec playwright install --with-deps chromium

      - name: Start mock OpenAI
        run: |
          pnpm --filter server exec tsx scripts/mock-openai-server.ts &
          # Wait for /health
          for i in {1..20}; do
            if curl -sf http://localhost:4000/health > /dev/null; then
              echo "mock-openai ready"
              break
            fi
            sleep 1
          done

      - name: Start server (background)
        env:
          PORT: 3001
          SUPABASE_URL: ${{ env.E2E_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ env.E2E_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ env.E2E_SUPABASE_SERVICE_KEY }}
          # Hardcoded dummy ENCRYPTION_KEY for CI — E2E never handles real
          # provider keys (mock-openai accepts anything). Stable value here
          # so the spec's inline aes256Encrypt and the server's
          # aes256Decrypt agree on the key material without needing a
          # GitHub Actions secret. NOT used in production deploy paths.
          ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          # The `requests` log is read through a pooled connection rather than
          # PostgREST. Locally there is no Supavisor in front, so point straight
          # at the Postgres the CLI started. Production uses the transaction
          # pooler on 6543; see apps/server/.env.example.
          SUPABASE_DB_POOLER_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
          OPENAI_API_BASE: http://localhost:4000/v1
          # R-32 Phase E — feedback admin allowlist for the spec. The value
          # must match E2E_FEEDBACK_ADMIN_EMAIL in the "Run Playwright smoke"
          # step or the PATCH assertion 403s. Stable string so production
          # SPANLENS_ADMIN_EMAILS does not need to know about it.
          SPANLENS_ADMIN_EMAILS: admin-e2e@spanlens.test
        run: |
          pnpm --filter server dev > /tmp/server.log 2>&1 &
          for i in {1..40}; do
            if curl -sf http://localhost:3001/health/ready > /dev/null; then
              echo "server ready"
              break
            fi
            sleep 1
          done

      - name: Start web (background)
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.E2E_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ env.E2E_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_API_URL: http://localhost:3001
          # middleware.ts resolves the workspace and the onboarding flag with
          # the service role. Without it every signed-in navigation is sent to
          # /onboarding, which is how the smoke spec failed on every run.
          SUPABASE_SERVICE_ROLE_KEY: ${{ env.E2E_SUPABASE_SERVICE_KEY }}
        run: |
          pnpm --filter web dev > /tmp/web.log 2>&1 &
          for i in {1..60}; do
            if curl -sf http://localhost:3000 > /dev/null; then
              echo "web ready"
              break
            fi
            sleep 1
          done

      - name: Run Playwright smoke
        env:
          E2E_BASE_URL: http://localhost:3000
          E2E_SERVER_URL: http://localhost:3001
          # Must match the dummy ENCRYPTION_KEY the server boots with so the
          # spec's inline AES-256-GCM helper writes a ciphertext the server's
          # aes256Decrypt can read back. See the "Start server" step above for
          # the rationale on hardcoding instead of using a secret.
          ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          # R-32 Phase E — admin email used by feedback.spec.ts. Must be
          # listed in the server's SPANLENS_ADMIN_EMAILS (set in the "Start
          # server" step). The spec emits a targeted error on 403 if these
          # drift apart.
          E2E_FEEDBACK_ADMIN_EMAIL: admin-e2e@spanlens.test
        run: pnpm --filter web exec playwright test --reporter=list

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ github.run_id }}
          path: |
            apps/web/test-results/
            apps/web/playwright-report/
          retention-days: 7

      - name: Upload server/web logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: dev-server-logs-${{ github.run_id }}
          path: |
            /tmp/server.log
            /tmp/web.log
          retention-days: 7

      - name: Stop services
        if: always()
        run: |
          supabase stop --no-backup || true
