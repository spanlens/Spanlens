          echo "Status: $STATUS"
          cat /tmp/body
          if [ "$STATUS" -ge 400 ]; then exit 1; fi
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}

  daily-03-50-maintain-request-partitions:
    name: Daily 03:50 UTC (maintain-request-partitions)
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.schedule == '50 3 * * *' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: POST /cron/maintain-request-partitions
        run: |
          BASE_URL='https://spanlens-server.vercel.app'
          STATUS=$(curl -sS -o /tmp/body -w '%{http_code}'             -H "Authorization: Bearer $CRON_SECRET"             "$BASE_URL/cron/maintain-request-partitions")
          echo "Status: $STATUS"
          cat /tmp/body
          if [ "$STATUS" -ge 400 ]; then exit 1; fi
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
