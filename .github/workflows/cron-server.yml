name: Cron — server sub-daily

# GitHub Actions cron safety net for Spanlens server endpoints that
# Vercel's scheduled crons keep silently dropping. As of 2026-06-15 the
# production `cron_job_runs` table over 24h shows severe under-firing
# of the */5 schedule (~10/288 runs = 3.5%) and partial drops on
# hourly schedules (self-monitor 2/24, detect-orphan-spans 4/24,
# detect-missing-model-prices 8/24). Project IS on Pro plan (40-cron
# quota) so this is a sync gap, not a quota cap. GH Actions also
# throttles short-cadence cron under load — neither scheduler alone
# is enough at sub-15min cadence, but together they cover most
# windows. For a hard guarantee on critical jobs (replay-fallback,
# self-monitor) set up an external pinger (cron-job.org, Better Stack
# heartbeat, EasyCron) hitting the same /cron/* URLs with the same
# Authorization header.
#
# Endpoints we re-fire from GitHub Actions, ordered by what breaks if
# they stay silent:
#
#   /cron/replay-fallback           every 5 min
#     Log-write fallback. When the INSERT into `requests` fails, the row
#     is queued in `requests_fallback` as a jsonb payload; this job drains
#     the queue back into the table. Silent = the next outage's logs sit
#     in the queue past their 7-day expiry and are gone for good. Highest
#     leverage of the lot.
#
#   /cron/execute-pending-deletions every 6h
#     Processes GDPR "right to be forgotten" requests sitting in
#     `pending_deletions`. Silent = compliance violation. Legal /
#     reputational risk.
#
#   /cron/self-monitor              hourly at :31
#     Cron-failure watchdog. Scans `cron_job_runs` for failure rows
#     and creates an internal_alert. Silent = the same class of bug
#     that hit us (Vercel scheduler stops firing X) takes longer to
#     notice next time. Meta-monitoring.
#
#   /cron/run-background-migrations every 5 min  (shipped earlier)
#     Background migration queue runner. Silent = ops cannot kick off
#     a new background migration without manually marking rows.
#
#   /cron/keep-warm                 every 5 min  (shipped earlier)
#     Warms the Supabase connection pool. Silent = the first request
#     after an idle period eats a cold start, roughly a one-second tax.
#     Low priority.
#
# Vercel scheduler stays configured in vercel.json so it still fires
# whichever endpoints it decides to honour. Both schedulers calling
# the same endpoint is fine — every handler holds an advisory lock or
# is naturally idempotent.
#
# Cron TIMING still matters, though the reason has changed. The daily jobs
# that scan `requests` are clustered at 03:00 in vercel.json so they share
# one window rather than each waking the database on its own schedule. Put
# new daily scanning crons in that slot. Two deliberate exceptions:
# recommend-savings-alerts stays at 09:00 because it sends customer email
# and the delivery hour matters, and the weekly pair (stale-key-reminders,
# weekly-digest) already shares Monday 09:00.
#
# The endpoints that scan `requests` across every tenant are idempotent but
# not free: the table grows with traffic, and the work lands on the same
# database instance that serves the proxy auth path. Three schedulers firing
# the same endpoint at different minutes used to mean three full scans. They
# now debounce themselves in the handler via lib/cron-cadence.ts, so the
# duplicate firings here stay harmless: whichever scheduler wins does the
# work and the others get a 200 with {"skipped":"cadence"}.
# Nothing in this workflow needs changing when that interval is tuned.
#
# Usage / billing crons reclaimed into IaC (2026-07-22): these four were
# firing in production via an external Better Stack monitor but were
# declared in NEITHER vercel.json NOR this file, so their schedule lived
# only in Better Stack's dashboard. If that monitor is ever deleted they
# stop silently. Adding them here makes the schedule version-controlled
# and gives defense-in-depth; Better Stack stays as the primary/backup.
# Cadences match the observed production runs in cron_job_runs.
#
#   /cron/aggregate-usage           hourly at :00
#     Rolls raw usage into usage_daily. Silent = usage rollups stall.
#   /cron/check-quota-warnings      hourly at :15
#     80/100% quota warning emails + dashboard banner. Silent = users
#     hit their cap with no warning.
#   /cron/prune-logs                daily 03:00
#     Retention pruning + rate-limit bucket cleanup. Silent = tables grow.
#   /cron/report-usage-overage      daily 03:30
#     Paddle usage-based overage reporting. Silent = overage revenue is
#     never billed. Highest-stakes of the four.
#
# Partition upkeep backed up here (2026-08-20): /cron/maintain-request-partitions
# was added with the move of `requests` back to Postgres and was declared only
# in vercel.json. It is the one cron whose silence is not recoverable by simply
# running it later. `requests` is RANGE-partitioned by month, and a row that
# arrives for a month with no partition lands in the DEFAULT partition. From
# that moment creating the real partition for that range FAILS, because
# Postgres scans DEFAULT under ACCESS EXCLUSIVE to prove nothing conflicts and
# finds something, and that scan blocks the proxy's writes while it runs.
# Recovery means detaching DEFAULT, moving rows, and reattaching, on a table
# holding customer prompts.
#
# Given gotcha #32, a single scheduler is the wrong bet for that. The job runs
# at 03:20 in vercel.json and 03:50 here, offset rather than matched: the
# create half is idempotent either way, but two runs landing together could
# both try to DROP the same stale partition and one would lose the race. The
# handler tolerates that (a failed drop is reported, not fatal) and the offset
# means it does not come up.
#
# Required secret: CRON_SECRET in Settings → Secrets, matching the
# Vercel env var of the same name (the handler compares against it).
#
# Each scheduled trigger fires only the job whose `if:` matches the
# triggering schedule, so cadences stay correct. workflow_dispatch
# fires all jobs at once for ad-hoc operator testing.

on:
  schedule:
    # Cadence has to match what the handler expects. Listed here in the
    # same order as the `if:` checks below for grepability. Each entry
    # fires only the matching job (the `if:` predicates downstream
    # compare github.event.schedule to the cron string).
    - cron: '*/5 * * * *'      # every 5 min — replay-fallback, run-background-migrations, keep-warm
    - cron: '0 */6 * * *'      # every 6h on the hour — execute-pending-deletions
    - cron: '31 * * * *'       # hourly :31 — self-monitor
    - cron: '17 * * * *'       # hourly :17 — detect-orphan-spans
    - cron: '0 * * * *'        # hourly :00 — detect-missing-model-prices
    - cron: '0 9 * * *'        # daily 09:00 — recommend-savings-alerts
    - cron: '0 10 * * *'       # daily 10:00 — check-past-due-downgrades
    - cron: '0 3 * * *'        # daily 03:00 — prune-judge-cache
    - cron: '15 3 * * *'       # daily 03:15 — purge-proxy-cache
    - cron: '0 9 * * 1'        # weekly Monday 09:00 — stale-key-reminders + weekly-digest
    - cron: '30 */6 * * *'     # every 6h at :30 — detect-data-silence
    - cron: '15 * * * *'       # hourly :15 — check-quota-warnings
    - cron: '30 3 * * *'       # daily 03:30 — report-usage-overage
    - cron: '50 3 * * *'       # daily 03:50 — maintain-request-partitions
  workflow_dispatch:

concurrency:
  group: cron-server
  cancel-in-progress: false

jobs:
  every-5min:
    name: Every 5 min (replay-fallback + run-background-migrations + keep-warm)
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.schedule == '*/5 * * * *' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: POST /cron/replay-fallback
        run: |
          BASE_URL='https://spanlens-server.vercel.app'
          STATUS=$(curl -sS -o /tmp/body -w '%{http_code}' \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$BASE_URL/cron/replay-fallback")
          echo "Status: $STATUS"
          cat /tmp/body
          if [ "$STATUS" -ge 400 ]; then exit 1; fi
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}

      - name: POST /cron/run-background-migrations
        run: |
          BASE_URL='https://spanlens-server.vercel.app'
          STATUS=$(curl -sS -o /tmp/body -w '%{http_code}' \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$BASE_URL/cron/run-background-migrations")
          echo "Status: $STATUS"
          cat /tmp/body
          if [ "$STATUS" -ge 400 ]; then exit 1; fi
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}

      - name: POST /cron/keep-warm
        run: |
          BASE_URL='https://spanlens-server.vercel.app'
          STATUS=$(curl -sS -o /tmp/body -w '%{http_code}' \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$BASE_URL/cron/keep-warm")
          echo "Status: $STATUS"
          cat /tmp/body
          if [ "$STATUS" -ge 400 ]; then exit 1; fi
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}

  every-6h:
    name: Every 6 hours (execute-pending-deletions)
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.schedule == '0 */6 * * *' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: POST /cron/execute-pending-deletions
        run: |
          BASE_URL='https://spanlens-server.vercel.app'
          STATUS=$(curl -sS -o /tmp/body -w '%{http_code}' \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$BASE_URL/cron/execute-pending-deletions")
          echo "Status: $STATUS"
          cat /tmp/body
          if [ "$STATUS" -ge 400 ]; then exit 1; fi
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}

  hourly-31:
    name: Hourly at :31 (self-monitor)
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.schedule == '31 * * * *' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: POST /cron/self-monitor
        run: |
          BASE_URL='https://spanlens-server.vercel.app'
          STATUS=$(curl -sS -o /tmp/body -w '%{http_code}' \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$BASE_URL/cron/self-monitor")
          echo "Status: $STATUS"
          cat /tmp/body
          if [ "$STATUS" -ge 400 ]; then exit 1; fi
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}

  hourly-17:
    name: Hourly at :17 (detect-orphan-spans)
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.schedule == '17 * * * *' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: POST /cron/detect-orphan-spans
        run: |
          BASE_URL='https://spanlens-server.vercel.app'
          STATUS=$(curl -sS -o /tmp/body -w '%{http_code}' \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$BASE_URL/cron/detect-orphan-spans")
          echo "Status: $STATUS"
          cat /tmp/body
          if [ "$STATUS" -ge 400 ]; then exit 1; fi
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}

  hourly-00:
    name: Hourly at :00 (detect-missing-model-prices)
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.schedule == '0 * * * *' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: POST /cron/detect-missing-model-prices
